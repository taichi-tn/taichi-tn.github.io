<script>
document.getElementById('localVideoInput').addEventListener('change', function(event) {

    if (file) {
        const player = document.getElementById('myVideoPlayer');
        const container = document.getElementById('movie-player-5184');
        if (player.src) {
            URL.revokeObjectURL(player.src);

        const videoURL = URL.createObjectURL(file);
        player.src = videoURL;
        player.load();
        if (container) {
            container.classList.remove('vjs-paused');
            container.classList.add('vjs-playing');
        }
        player.play().catch(function(error) {
