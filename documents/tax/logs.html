<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>学習記録一覧</title>
    <style>
        body {
            font-family: "ヒラギノ明朝 ProN W3", "Hiragino Mincho ProN", "MS P明朝", "MS Mincho", "serif";
            background: #f4f7f6; color: #1a1a1a; padding: 40px; margin: 0;
        }
        .container {
            max-width: 600px; margin: 0 auto; background: #fff; padding: 30px;
            border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.05);
        }
        h1 { font-size: 1.4rem; border-bottom: 2px solid #2c3e50; padding-bottom: 10px; margin-top: 0; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #fafafa; font-size: 0.9rem; color: #666; font-weight: bold; }
        td { font-size: 1rem; }
        
        .no-data { text-align: center; color: #999; padding: 30px; font-size: 0.9rem; }
        .back-link { display: inline-block; margin-top: 20px; font-size: 0.85rem; color: #2c3e50; text-decoration: none; border: 1px solid #2c3e50; padding: 5px 15px; border-radius: 4px; background: #fff; }
        .back-link:hover { background: #eef2f7; }
    </style>
</head>
<body>

<div class="container">
    <h1>消費税法 学習記録ログ</h1>
    
    <table>
        <thead>
            <tr>
                <th>学習日</th>
                <th>勉強時間</th>
            </tr>
        </thead>
        <tbody id="log-table-body">
            <tr>
                <td colspan="2" class="no-data">読み込み中...</td>
            </tr>
        </tbody>
    </table>

    <!-- メイン画面に戻るボタン（パスは環境に合わせて調整してください） -->
    <a href="index.html" class="back-link">← 暗記ツールに戻る</a>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>

<script>
// Firebase初期化（index.htmlと同じ設定）
const firebaseConfig = {
  apiKey: "AIzaSyBuU0l8CzxvUJshPljuAq5LLI8mCGG0f2g",
  authDomain: "warehs.firebaseapp.com",
  databaseURL: "https://warehs-default-rtdb.firebaseio.com",
  projectId: "warehs",
  storageBucket: "warehs.firebasestorage.app",
  messagingSenderId: "351013737525",
  appId: "1:351013737525:web:af00783211e57ec5b18d7c",
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const SUBJECT_PREFIX = 'shohi';

async function loadHistoryLog() {
    const tbody = document.getElementById('log-table-body');
    
    try {
        // history ノードからデータを取得
        const snapshot = await db.ref(`${SUBJECT_PREFIX}/history`).once('value');
        const historyData = snapshot.val();
        
        if (!historyData) {
            tbody.innerHTML = `<tr><td colspan="2" class="no-data">まだ学習記録がありません。</td></tr>`;
            return;
        }
        
        // 日付の新しい順（降順）に並び替えるために、キー配列を取得してリバース
        const dates = Object.keys(historyData).sort().reverse();
        
        let htmlRows = "";
        dates.forEach(date => {
            const time = historyData[date];
            // YYYY-MM-DD を YYYY年MM月DD日 に見やすく整形
            const formattedDate = date.replace(/(\d{4})-(\d{2})-(\d{2})/, '$1年$2月$3日');
            
            htmlRows += `
                <tr>
                    <strong><td>${formattedDate}</td></strong>
                    <td>${time}</td>
                </tr>
            `;
        });
        
        tbody.innerHTML = htmlRows;
        
    } catch (error) {
        console.error("ログの読み込みに失敗しました:", error);
        tbody.innerHTML = `<tr><td colspan="2" class="no-data" style="color:red;">データの読み込みに失敗しました。</td></tr>`;
    }
}

// ページ読み込み時に実行
window.onload = loadHistoryLog;
</script>
</body>
</html>
