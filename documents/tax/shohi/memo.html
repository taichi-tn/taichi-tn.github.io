<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memo</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%; overflow: hidden;
            background-color: #fcfcfc;
        }
        /* 全画面入力エリア */
        #editor {
            width: 100vw; height: 100vh;
            padding: 40px 20px;
            box-sizing: border-box;
            border: none; outline: none;
            font-size: 1.1rem; line-height: 1.6;
            resize: none; font-family: sans-serif;
            background: transparent;
        }
        /* 右上のタイムスタンプ */
        #status {
            position: fixed; top: 10px; right: 20px;
            font-size: 0.8rem; color: #aaa;
            pointer-events: none; /* クリックを邪魔しない */
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div id="status">Syncing...</div>
    <textarea id="editor" placeholder="自由に記述... (自動保存)"></textarea>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, serverTimestamp }
               from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // --- Firebase設定 ---
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        // メモの保存先（ドキュメントIDを "single-memo" で固定）
        const memoDoc = doc(db, "memos", "single-memo");
        const editor = document.getElementById("editor");
        const status = document.getElementById("status");

        let timeout = null;

        // 1. データのリアルタイム読み込み
        onSnapshot(memoDoc, (snapshot) => {
            if (snapshot.exists() && document.activeElement !== editor) {
                const data = snapshot.data();
                editor.value = data.content || "";
                updateTimestamp(data.updatedAt);
            }
        });

        // 2. 入力時の自動保存 (デバウンス処理: 入力が止まって500ms後に送信)
        editor.addEventListener("input", () => {
            status.innerText = "Saving...";
            clearTimeout(timeout);
            
            timeout = setTimeout(async () => {
                try {
                    await setDoc(memoDoc, {
                        content: editor.value,
                        updatedAt: serverTimestamp()
                    }, { merge: true });
                    
                    const now = new Date();
                    status.innerText = `Saved: ${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;
                } catch (e) {
                    status.innerText = "Error!";
                }
            }, 500);
        });

        // タイムスタンプ表示用の関数
        function updateTimestamp(ts) {
            if (!ts) return;
            const d = ts.toDate();
            status.innerText = `Saved: ${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;
        }
    </script>
</body>
</html>
