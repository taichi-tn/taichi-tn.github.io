<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memo</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #f9f9f9; }
        #editor {
            width: 100vw; height: 100vh; padding: 40px 20px; box-sizing: border-box;
            border: none; outline: none; font-size: 1.1rem; line-height: 1.6;
            resize: none; font-family: 'Hiragino Kaku Gothic ProN', sans-serif;
            background: transparent;
        }
        #status {
            position: fixed; top: 10px; right: 20px; font-size: 0.8rem;
            color: #888; pointer-events: none; font-family: monospace;
        }
    </style>
</head>
<body>

    <div id="status">Connecting...</div>
    <textarea id="editor" placeholder="..."></textarea>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, serverTimestamp }
               from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // --- Firebase設定（ご自身のものに差し替えてください） ---
        const firebaseConfig = {
          apiKey: "AIzaSyBuU0l8CzxvUJshPljuAq5LLI8mCGG0f2g",
          authDomain: "warehs.firebaseapp.com",
          databaseURL: "https://warehs-default-rtdb.firebaseio.com",
          projectId: "warehs",
          storageBucket: "warehs.firebasestorage.app",
          messagingSenderId: "351013737525",
          appId: "1:351013737525:web:af00783211e57ec5b18d7c",
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const memoRef = ref(db, 'shohi/memo');

        const editor = document.getElementById("editor");
        const status = document.getElementById("status");
        let timeout = null;

        // 1. 初回読み込み & データの同期
        onValue(memoRef, (snapshot) => {
            const data = snapshot.val();
            // 入力中でない場合のみ、画面の内容をクラウドに合わせる（カーソル飛び防止）
            if (data && document.activeElement !== editor) {
                editor.value = data.content || "";
                if (data.updatedAt) updateTimestamp(data.updatedAt);
            }
        });

        // 2. 入力時の自動保存 (500msのデバウンス)
        editor.addEventListener("input", () => {
            status.innerText = "Saving...";
            clearTimeout(timeout);
            
            timeout = setTimeout(() => {
                set(memoRef, {
                    content: editor.value,
                    updatedAt: serverTimestamp()
                }).then(() => {
                    updateTimestamp(Date.now());
                }).catch((error) => {
                    status.innerText = "Error!";
                    console.error(error);
                });
            }, 500);
        });

        function updateTimestamp(time) {
            const d = new Date(time);
            const hh = d.getHours();
            const mm = String(d.getMinutes()).padStart(2, '0');
            status.innerText = `Saved: ${hh}:${mm}`;
        }
    </script>
</body>
</html>
