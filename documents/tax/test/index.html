<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>条文暗記ツール</title>
    <style>
        :root {
            --sidebar-width: 250px;
            --primary-blue: #2c3e50;
            --text-color: #1a1a1a;
            --bg-color: #f4f7f6;
        }
        
        body {
            display: flex; margin: 0;
            font-family: "ヒラギノ明朝 ProN W3", "Hiragino Mincho ProN", "MS P明朝", "MS Mincho", "serif";
            height: 100vh; background: var(--bg-color); color: var(--text-color); overflow: hidden;
        }
        
        #sidebar {
            width: var(--sidebar-width); background: #fff; border-right: 1px solid #dcdfe6;
            display: flex; flex-direction: column; height: 100vh; flex-shrink: 0;
        }
        
        .sidebar-title-area {
            font-size: 0.85rem;
            padding: 15px 20px;
            margin: 0;
            color: #666;
            font-weight: bold;
        }
        #timer-display {
            font-family: inherit;
            font-weight: inherit;
            color: inherit;
            margin-left: 5px;
        }

        #menu-container { flex: 1; overflow-y: auto; }
        .menu-item {
            padding: 10px 20px; cursor: pointer; font-size: 0.85rem; border-bottom: 1px solid #eee; line-height: 1.3;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .menu-item .star-mark { color: #f39c12; margin-right: 5px; font-weight: bold; }
        .menu-item:hover { background: #f9f9f9; }
        .menu-item.active { background: #eef2f7; color: #000; font-weight: bold; border-left: 4px solid var(--primary-blue); }

        #main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #fff; min-width: 0; }
        #header {
            padding: 10px 20px; border-bottom: 1px solid #eee; display: flex;
            justify-content: space-between; align-items: center; background: #fafafa;
            gap: 10px;
        }
        
        /* タイトルの省略表示スタイル */
        #current-title {
            margin: 0;
            font-size: 1.1rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            min-width: 0;
        }
        
        .review-check-container {
            display: flex; align-items: center; gap: 5px; font-size: 0.9rem; cursor: pointer;
            background: #fffbe6; padding: 2px 8px; border: 1px solid #ffe58f; border-radius: 4px;
            white-space: nowrap;
        }

        #display-area {
            flex: 1; overflow-y: auto; padding: 20px 40px;
            line-height: 1.6; font-size: 1.1rem; text-align: justify;
        }

        #display-area h3, #display-area h4, #display-area p { margin: 6px 0 !important; padding: 0 !important; }
        #display-area h3 { padding-left: 1.5em !important; text-indent: -1.5em !important; border-bottom: 1px solid #000; margin-top: 20px !important; }
        #display-area h4 { padding-left: 1.5em !important; text-indent: -1.5em !important; }
        #display-area .indent-1 { padding-left: 3.5em !important; text-indent: -1.5em !important; display: block; }
        #display-area .indent-2 { padding-left: 5.0em !important; text-indent: -1.5em !important; display: block; }
        #display-area .body-text { padding-left: 3.5em !important; text-indent: 0 !important; display: block; }

        .mask { background: #000; color: #000; cursor: pointer; padding: 0 1px; display: inline; border-bottom: 1px solid #000; position: relative; }
        .mask.reveal { background: transparent; color: #000; font-weight: bold; }
        .wrong-memo { color: #d44; font-size: 0.9em; margin-left: 4px; text-decoration: line-through; font-weight: normal; }
        .remove-btn { position: absolute; top: -10px; background: #f00; color: #fff; font-size: 9px; padding: 0 3px; border-radius: 3px; display: none; }
        .mask:hover .remove-btn { display: inline-block; }

        button, select { font-size: 0.85rem; padding: 5px 10px; cursor: pointer; white-space: nowrap; }
        .btn-primary { background: var(--primary-blue); color: #fff; border: none; border-radius: 5px;}
        .btn-danger { background: #fff; color: #d44; border: 1px solid #d44; border-radius: 5px;}
        .btn-success { background: #2ecc71; color: #fff; border: none; border-radius: 5px;}

        #memo-container { height: 40%; border-top: 2px solid #dcdfe6; display: flex; flex-direction: column; background: #fffbe6; }
        #memo-container h2 { font-size: 0.8rem; padding: 10px 20px; background: #fdf6ec; color: #e6a23c; margin: 0; }
        #memo-area { flex: 1; width: 100%; border: none; padding: 10px; box-sizing: border-box; background: transparent; font-family: inherit; font-size: 0.9rem; resize: none; outline: none; }
        #memo-timestamp { font-size: 0.7rem; color: #999; padding: 5px 10px; text-align: right; background: #fff; border-top: 1px solid #eee; }
    </style>
</head>
<body>

<div id="sidebar">
    <div style="display: flex; align-items: center; justify-content: space-between; background: #eee; padding-right: 10px;">
        <div class="sidebar-title-area">
            法人税法<span id="timer-display">(読込中)</span>
        </div>
        <a href="../shohi/index.html" style="font-size: 0.7rem; color: var(--primary-blue); text-decoration: none; border: 1px solid; padding: 2px 5px; border-radius: 3px; background: #fff;">消費税へ</a>
    </div>
    
    <div id="menu-container"></div>
    
    <div style="padding: 10px;">
        <button class="btn-danger" style="width:100%" onclick="resetCurrentSheet()">暗記を全消し</button>
    </div>

    <div id="memo-container">
        <h2>共有メモ</h2>
        <textarea id="memo-area" placeholder="メモを入力..." oninput="autoSaveMemo()"></textarea>
        <div id="memo-timestamp">未保存</div>
    </div>
</div>

<div id="main-content">
    <div id="header">
        <h1 id="current-title">条文を選択</h1>
        
        <!-- 日付選択プルダウンと新規作成ボタン（ラベル削除） -->
        <div style="display: flex; align-items: center; gap: 5px; flex-shrink: 0;">
            <select id="date-select" onchange="onDateChanged()"></select>
            <button class="btn-primary" onclick="createNewTodayDate()">今日を作成</button>
        </div>

        <div style="display: flex; align-items: center; gap: 10px; flex-shrink: 0;">
            <!-- 統合されたタイマートグルボタン -->
            <button id="timer-toggle-btn" class="btn-primary" onclick="toggleTimer()">開始</button>

            <label class="review-check-container">
                <input type="checkbox" id="review-checkbox" onchange="toggleReviewFlag()"> 復習
            </label>
            <span id="update-time" style="font-size:0.75rem; color:#909399; white-space:nowrap;"></span>
            <button class="btn-primary" onclick="saveCurrentData()">保存</button>
        </div>
    </div>
    <div id="display-area" onmouseup="handleSelection()"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>

<script>
// Firebase初期化
const firebaseConfig = {
  apiKey: "AIzaSyBuU0l8CzxvUJshPljuAq5LLI8mCGG0f2g",
  authDomain: "warehs.firebaseapp.com",
  databaseURL: "https://warehs-default-rtdb.firebaseio.com",
  projectId: "warehs",
  storageBucket: "warehs.firebasestorage.app",
  messagingSenderId: "351013737525",
  appId: "1:351013737525:web:af00783211e57ec5b18d7c",
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const dataList = [
{ id: "tax_1", title: "1-1：納税義務者と課税所得等の範囲", file: "text/1-1.txt" },
{ id: "tax_2", title: "1-2：事業年度", file: "text/1-2.txt" },
{ id: "tax_3", title: "1-3：納税地", file: "text/1-3.txt" },
{ id: "tax_4", title: "1-4：資本金等の額", file: "text/1-4.txt" },
{ id: "tax_5", title: "1-5：利益積立金額", file: "text/1-5.txt" },
{ id: "tax_6", title: "1-6：所得の帰属に関する通則", file: "text/1-6.txt" },
];

let currentFileId = "";
let originalHtmlBackup = "";
let memoSaveTimer;
const SUBJECT_PREFIX = 'hojin';
let currentDate = "20260731"; // 選択中の日付

// タイマー用変数
let timerInterval = null;

// メニュー生成
const menuContainer = document.getElementById('menu-container');
dataList.forEach(item => {
    const div = document.createElement('div');
    div.className = 'menu-item';
    div.innerText = item.title;
    div.onclick = () => loadJoubun(item);
    menuContainer.appendChild(div);
});

// 日付ヘルパー関数（YYYYMMDD 形式を取得）
function getFormattedToday() {
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, '0');
    const d = String(now.getDate()).padStart(2, '0');
    return `${y}${m}${d}`;
}

// 日付一覧をロードしてプルダウンを構築
async function loadDateList() {
    const snapshot = await db.ref(`${SUBJECT_PREFIX}`).once('value');
    const allSubjectData = snapshot.val() || {};
    
    let dates = Object.keys(allSubjectData).filter(key => /^\d{8}$/.test(key));
    
    if (!dates.includes("20260731")) {
        dates.push("20260731");
    }
    
    dates.sort((a, b) => b.localeCompare(a));
    
    const dateSelect = document.getElementById('date-select');
    dateSelect.innerHTML = "";
    
    dates.forEach(d => {
        const option = document.createElement('option');
        option.value = d;
        option.innerText = `${d.substring(0,4)}/${d.substring(4,6)}/${d.substring(6,8)}`;
        dateSelect.appendChild(option);
    });
    
    if (dates.includes(currentDate)) {
        dateSelect.value = currentDate;
    } else {
        currentDate = dates[0];
        dateSelect.value = currentDate;
    }
}

// 日付変更時のハンドラ
async function onDateChanged() {
    currentDate = document.getElementById('date-select').value;
    updateSidebarStars();
    if (currentFileId) {
        const currentItem = dataList.find(i => i.id === currentFileId);
        if (currentItem) loadJoubun(currentItem);
    }
}

// 今日を新規作成ボタンの処理
async function createNewTodayDate() {
    const today = getFormattedToday();
    currentDate = today;
    
    await loadDateList();
    document.getElementById('date-select').value = today;
    
    onDateChanged();
}

async function updateSidebarStars() {
    const snapshot = await db.ref(`${SUBJECT_PREFIX}/${currentDate}`).once('value');
    const allData = snapshot.val() || {};
    const items = document.querySelectorAll('.menu-item');
    items.forEach((div, index) => {
        const itemData = dataList[index];
        const saved = allData[itemData.id];
        const oldStar = div.querySelector('.star-mark');
        if (oldStar) oldStar.remove();
        if (saved && saved.needsReview) {
            const star = document.createElement('span');
            star.className = 'star-mark';
            star.innerText = '★ ';
            div.prepend(star);
        }
    });
}

async function loadJoubun(item) {
    currentFileId = item.id;
    document.getElementById('current-title').innerText = item.title;
    document.querySelectorAll('.menu-item').forEach(el => el.classList.toggle('active', el.innerText.includes(item.title)));

    try {
        const response = await fetch(item.file);
        const text = await response.text();
        originalHtmlBackup = parseTextToHTML(text);

        const snapshot = await db.ref(`${SUBJECT_PREFIX}/${currentDate}/${currentFileId}`).once('value');
        const savedData = snapshot.val();

        if (savedData) {
            renderHTML(applyLatestClasses(savedData.html));
            document.getElementById('update-time').innerText = savedData.timestamp ? "保存: " + savedData.timestamp : "";
            document.getElementById('review-checkbox').checked = !!savedData.needsReview;
        } else {
            renderHTML(originalHtmlBackup);
            document.getElementById('update-time').innerText = "未保存";
            document.getElementById('review-checkbox').checked = false;
        }
    } catch (e) {
        document.getElementById('display-area').innerHTML = "読み込みエラー";
    }
}

function parseTextToHTML(text) {
    return text.split('\n').map(line => {
        const trimmed = line.trim();
        if (!trimmed) return "";
        if (/^[０-９\d]．/.test(trimmed)) return `<h3>${line}</h3>`;
        if (/^\([０-９\d]\)/.test(trimmed)) return `<h4>${line}</h4>`;
        if (/^[①-⑳]/.test(trimmed)) return `<p class="indent-1">${line}</p>`;
        if (/^\([ア-ンイ]\)/.test(trimmed) || /^[ア-ンイ]/.test(trimmed)) return `<p class="indent-2">${line}</p>`;
        return `<p class="body-text">${line}</p>`;
    }).join('');
}

function renderHTML(html) {
    const area = document.getElementById('display-area');
    area.innerHTML = html;
    area.querySelectorAll('.mask').forEach(setupMaskEvents);
}

function applyLatestClasses(html) {
    const temp = document.createElement('div');
    temp.innerHTML = html;
    temp.querySelectorAll('p').forEach(p => {
        const txt = p.innerText.trim();
        if (/^[①-⑳]/.test(txt)) p.className = "indent-1";
        else if (/^\([ア-ンイ]\)/.test(txt) || /^[ア-ンイ]/.test(txt)) p.className = "indent-2";
        else if (!p.className) p.className = "body-text";
    });
    return temp.innerHTML;
}

function setupMaskEvents(el) {
    el.onclick = function(e) {
        if (e.target.classList.contains('remove-btn')) return;
        if (this.classList.contains('reveal')) {
            this.classList.remove('reveal');
            const memoEl = this.querySelector('.wrong-memo');
            if (memoEl) memoEl.remove();
        } else {
            this.classList.add('reveal');
            if (this.dataset.memo) {
                const memoSpan = document.createElement('span');
                memoSpan.className = 'wrong-memo';
                memoSpan.textContent = `(誤: ${this.dataset.memo})`;
                this.appendChild(memoSpan);
            }
        }
    };
    if (!el.querySelector('.remove-btn')) {
        const btn = document.createElement('span');
        btn.className = 'remove-btn';
        btn.innerText = '×';
        btn.onclick = (e) => { e.stopPropagation(); removeSingleMask(el); };
        el.appendChild(btn);
    }
}

function handleSelection() {
    const sel = window.getSelection();
    if (!sel.rangeCount || sel.toString().length === 0) return;
    const userAnswer = prompt("間違いメモ");
    if (userAnswer === null) return;
    const range = sel.getRangeAt(0);
    const span = document.createElement('span');
    span.className = 'mask';
    span.textContent = sel.toString();
    if (userAnswer.trim() !== "") span.dataset.memo = userAnswer;
    setupMaskEvents(span);
    range.deleteContents();
    range.insertNode(span);
    sel.removeAllRanges();
}

function removeSingleMask(maskEl) {
    const text = maskEl.firstChild.textContent;
    maskEl.parentNode.replaceChild(document.createTextNode(text), maskEl);
}

function saveCurrentData() {
    if (!currentFileId) return;
    const now = new Date();
    const timeStr = `${now.getMonth()+1}/${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;
    const html = document.getElementById('display-area').innerHTML;
    const needsReview = document.getElementById('review-checkbox').checked;
    db.ref(`${SUBJECT_PREFIX}/${currentDate}/${currentFileId}`).set({
        html: html, timestamp: timeStr, needsReview: needsReview
    }).then(() => {
        document.getElementById('update-time').innerText = "保存: " + timeStr;
        updateSidebarStars();
        loadDateList();
    });
}

function toggleReviewFlag() { saveCurrentData(); }
function resetCurrentSheet() {
    if (!currentFileId || !confirm("リセットしますか？")) return;
    renderHTML(originalHtmlBackup);
    db.ref(`${SUBJECT_PREFIX}/${currentDate}/${currentFileId}`).remove();
}

/* --- タイマー機能（1ボタン切り替え） --- */
function toggleTimer() {
    if (timerInterval === null) {
        startTimer();
    } else {
        stopTimer();
    }
}

async function loadSavedTimer() {
    try {
        const todayStr = new Date().toLocaleDateString('sv-SE');
        
        const snapshot = await db.ref(`logs/today`).once('value');
        const timerData = snapshot.val();
        
        let storedTimeStr = "00:00:00";
        
        if (timerData && timerData.last_date === todayStr) {
            storedTimeStr = timerData.study_time || "00:00:00";
        } else {
            await db.ref(`logs/today`).set({
                study_time: "00:00:00",
                last_date: todayStr
            });
        }
        
        document.getElementById('timer-display').innerText = `(${storedTimeStr})`;
        
    } catch (error) {
        console.error("タイマーの読み込みに失敗しました:", error);
        document.getElementById('timer-display').innerText = `(00:00:00)`;
    }
}

function startTimer() {
    if (timerInterval !== null) return;
    
    let displayText = document.getElementById('timer-display').innerText;
    let timeStr = displayText.replace(/[() ]/g, '');
    
    let parts = timeStr.split(':');
    let currentSeconds = 0;
    if (parts.length === 3) {
        let hours = parseInt(parts[0], 10) || 0;
        let minutes = parseInt(parts[1], 10) || 0;
        let seconds = parseInt(parts[2], 10) || 0;
        currentSeconds = (hours * 3600) + (minutes * 60) + seconds;
    }
    
    if (isNaN(currentSeconds)) currentSeconds = 0;
    
    timerInterval = setInterval(() => {
        currentSeconds++;
        
        let h = Math.floor(currentSeconds / 3600);
        let m = Math.floor((currentSeconds % 3600) / 60);
        let s = currentSeconds % 60;
        
        let hStr = String(h).padStart(2, '0');
        let mStr = String(m).padStart(2, '0');
        let sStr = String(s).padStart(2, '0');
        
        document.getElementById('timer-display').innerText = `(${hStr}:${mStr}:${sStr})`;
    }, 1000);
    
    // ボタンの表示変更（停止モードへ）
    const btn = document.getElementById('timer-toggle-btn');
    btn.innerText = "停止";
    btn.className = "btn-success";
}

async function stopTimer() {
    if (timerInterval === null) return;

    clearInterval(timerInterval);
    timerInterval = null;

    // ボタンの表示変更（開始モードへ）
    const btn = document.getElementById('timer-toggle-btn');
    btn.innerText = "開始";
    btn.className = "btn-primary";

    const todayStr = new Date().toLocaleDateString('sv-SE');
    let currentTimerStr = document.getElementById('timer-display').innerText.replace(/[() ]/g, '');

    if (!currentTimerStr || currentTimerStr.includes("NaN") || currentTimerStr.length !== 8) {
        currentTimerStr = "00:00:00";
    }

    try {
        await db.ref(`logs/today`).set({
            study_time: currentTimerStr,
            last_date: todayStr
        });
        
        await db.ref(`logs/${todayStr}`).set(currentTimerStr);
    } catch (error) {
        console.error("Firebaseへの保存エラー:", error);
    }
}

/* メモ機能 */
async function loadMemo() {
    const snapshot = await db.ref(`${SUBJECT_PREFIX}/memo`).once('value');
    const memoData = snapshot.val();
    if (memoData) {
        document.getElementById('memo-area').value = memoData.text || "";
        document.getElementById('memo-timestamp').innerText = "同期済: " + memoData.timestamp;
    }
}

function autoSaveMemo() {
    document.getElementById('memo-timestamp').innerText = "入力中...";
    clearTimeout(memoSaveTimer);
    memoSaveTimer = setTimeout(() => {
        const text = document.getElementById('memo-area').value;
        const now = new Date();
        const timeStr = `${now.getMonth()+1}/${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;
        db.ref(`${SUBJECT_PREFIX}/memo`).set({ text: text, timestamp: timeStr }).then(() => {
            document.getElementById('memo-timestamp').innerText = "自動保存: " + timeStr;
        });
    }, 1000);
}

window.onload = async () => {
    await loadDateList();
    updateSidebarStars();
    loadMemo();
    loadSavedTimer();
};
</script>
</body>
</html>
